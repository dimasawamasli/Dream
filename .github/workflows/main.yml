name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Rearrange Files to Android Structure
        run: |
          # Membuat struktur folder Android yang benar
          mkdir -p app/src/main/java/com/example/myapp
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/mipmap-anydpi-v26

          # Memindahkan file-file ke folder yang tepat
          [ -f AndroidManifest.xml ] && mv AndroidManifest.xml app/src/main/
          [ -f MainActivity.kt ] && mv MainActivity.kt app/src/main/java/com/example/myapp/
          [ -f Screens.kt ] && mv Screens.kt app/src/main/java/com/example/myapp/
          [ -f ShizukuShell.kt ] && mv ShizukuShell.kt app/src/main/java/com/example/myapp/
          [ -f SpaceBackground.kt ] && mv SpaceBackground.kt app/src/main/java/com/example/myapp/
          
          # Memindahkan aset gambar & teks xml
          [ -f ic_launcher_background.xml ] && mv ic_launcher_background.xml app/src/main/res/mipmap-anydpi-v26/
          [ -f ic_launcher_foreground.xml ] && mv ic_launcher_foreground.xml app/src/main/res/mipmap-anydpi-v26/
          [ -f ic_launcher_round.xml ] && mv ic_launcher_round.xml app/src/main/res/mipmap-anydpi-v26/
          [ -f strings.xml ] && mv strings.xml app/src/main/res/values/
          [ -f themes.xml ] && mv themes.xml app/src/main/res/values/

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build APK
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            # Jika gradlew tidak ada di root, jalankan via gradle bawaan runner
            gradle assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: my-app-apk
          path: |
            **/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/release/*.apk
